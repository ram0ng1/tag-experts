ramon-tag-experts:
  admin:
    edit_tag:
      expert_groups_label: Grupos de Especialistas
      expert_groups_help: Os usuários destes grupos são especialistas nesta tag. Os posts deles ganham um selo de especialista, e as discussões que eles respondem são marcadas como tendo resposta de especialista.
      accepts_recommendations_label: Permitir Recomendações de Especialistas
    permissions:
      recommend_label: Recomendar usuários como especialistas em tags
      review_label: Revisar sugestões de especialistas
    settings:
      badge_style_label: Selo de especialista
      badge_style_help: Como o selo aparece ao lado do nome de usuário nos posts.
      badge_style_options:
        label: Ícone e texto
        icon: Só o ícone, com dica ao passar o mouse
      threshold_label: Recomendações necessárias para uma sugestão
      threshold_help: Quando um usuário recebe esse número de recomendações numa tag, ele entra nas sugestões de especialistas para revisão.
      per_day_label: Recomendações por usuário por dia
      first_post_counts_label: O primeiro post da discussão conta como resposta de especialista
      suggestions_help: A moderação também revisa as sugestões pelo fórum, no menu do usuário.

  forum:
    post:
      expert_badge: Especialista
      expert_tooltip: "Especialista em {tags}"
    discussion:
      expert_reply_badge: Tem resposta de especialista
    user_controls:
      recommend_button: Recomendar como Especialista
    recommend_modal:
      title: "Recomendar {username}"
