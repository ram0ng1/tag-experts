      no_tags: Nenhuma tag aceita recomendações ainda.
      submit_button: => core.ref.save_changes
      saved_message: Suas recomendações foram salvas.
    header:
      suggestions_button: Sugestões de Especialistas
    notifications:
      approved_text: "Agora você é especialista em {tag}"
    settings:
      notify_approved_label: Alguém me torna especialista em uma tag

  api:
    not_accepting: Esta tag não aceita recomendações.
    self: Você não pode recomendar a si mesmo.
    already_expert: Este usuário já é especialista nesta tag.
    already_recommended: Você já recomendou este usuário nesta tag.
    limit_reached: "Você pode fazer até {max} recomendações por dia."
    already_resolved: Esta sugestão já foi revisada.
    no_expert_group: Escolha um dos grupos de especialistas desta tag.

  lib:
    gambits:
      expert_reply:
        key: resposta-especialista
    suggestions:
      heading: Sugestões de Especialistas
      empty: Nenhuma sugestão aguardando revisão.
      recommendations: "{count, plural, one {# recomendação} other {# recomendações}}"
      in_tag: "em {tag}"
      group_label: "Grupo para {username}"
      approve_button: Aprovar
      dismiss_button: Descartar
      approved_message: "{username} agora é especialista em {tag}."
      dismissed_message: A sugestão foi descartada.
      no_group: Escolha antes os grupos de especialistas desta tag.
      load_more_button: => core.ref.load_more
    gdpr:
      export_description: As recomendações que você fez e recebeu, e as suas sugestões de especialista.
      anonymize_description: As suas recomendações e sugestões de especialista são excluídas.
      delete_description: As suas recomendações e sugestões de especialista são excluídas.
