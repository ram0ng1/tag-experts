ramon-tag-experts:
  admin:
    edit_tag:
      expert_groups_label: Expert groups
      expert_groups_help: Members of these groups are experts in this tag. Their replies are highlighted and discussions they answer get an expert badge.
      accepts_endorsements_label: Members can endorse experts in this tag
    permissions:
      endorse_label: Endorse members as tag experts
      review_label: Review expert suggestions
    settings:
      threshold_label: Endorsements needed for a suggestion
      threshold_help: When a member gets this many endorsements in a tag, they show up in the expert suggestions for review.
      per_day_label: Endorsements per member per day
      first_post_counts_label: The first post of a discussion counts as an expert reply
      suggestions_help: Moderators can also review suggestions on the forum, from the user menu.

  forum:
    post:
      expert_badge: Expert
      expert_tooltip: "Expert in {tags}"
    discussion:
      expert_reply_badge: Has an expert reply
    user_controls:
      endorse_button: Endorse as expert
    endorse_modal:
      title: "Endorse {username}"
      text: Which tags does this member know well? Endorsements are private. When enough members agree, the moderators review it.
      no_tags: No tag accepts endorsements yet.
      submit: Save
      saved: Endorsements saved.
    header:
      suggestions_button: Expert suggestions
    notifications:
      approved_text: "You are now an expert in {tag}"
    settings:
      notify_approved_label: I become an expert in a tag

  api:
    not_accepting: This tag doesn't accept endorsements.
    self: You can't endorse yourself.
    already_expert: This member is already an expert in this tag.
    already_endorsed: You have already endorsed this member in this tag.
    limit_reached: "You can endorse up to {max} times a day."
    already_resolved: This suggestion has already been reviewed.
    no_expert_group: Choose one of this tag's expert groups.

  lib:
    gambits:
      expert_reply:
        key: expert-reply
    suggestions:
      heading: Expert suggestions
      empty: No suggestions waiting for review.
      endorsements: "{count, plural, one {# endorsement} other {# endorsements}}"
      in_tag: "in {tag}"
      group_label: "Group for {username}"
      approve: Approve
      dismiss: Dismiss
      approved: "{username} is now an expert in {tag}."
      dismissed: Suggestion dismissed.
      no_group: Choose expert groups for this tag first.
      load_more: Load more
    gdpr:
      export_description: The endorsements you gave and received.
      anonymize_description: Your endorsements and expert suggestions are deleted.
      delete_description: Your endorsements and expert suggestions are deleted.
